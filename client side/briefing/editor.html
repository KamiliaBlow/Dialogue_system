<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сценарист брифингов</title>
<!--
  Режим сценариста: рельеф (генерация + кисти), объекты из каталога, патрули по вейпоинтам,
  шаги диалога с привязкой камеры, условия контракта. Сценарий автоматически сохраняется
  в localStorage браузера; экспорт/импорт — JSON-файлом. Просмотр — тем же плеером (player.html).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="briefing.css">
<style>
:root{--panel:#0c0d0e;--panel2:#111214;--line:rgba(223,226,216,.1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;height:100vh;grid-template-columns:290px minmax(0,1fr) 340px;grid-template-rows:46px minmax(0,1fr) 182px}
.scroll{overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--ink4) transparent}

/* ---------- верхняя панель ---------- */
#top{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 10px 0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
#top .brand{display:flex;align-items:center;gap:10px;margin-right:10px}
#top .brand svg{width:22px;height:22px}
#top .brand b{font:600 13px var(--sans);letter-spacing:.22em}
#docTitle{font:300 15px var(--sans);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw}
#top .sp{flex:1}
#saveState{margin-right:8px;white-space:nowrap}
.btn{background:none;border:1px solid var(--ink4);padding:6px 11px;cursor:pointer;font:500 12px var(--sans);letter-spacing:.08em;color:var(--ink);transition:border-color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--ink3);background:rgba(223,226,216,.04)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri:hover{background:#fff}
.btn.on{border-color:var(--ink);background:rgba(223,226,216,.1)}
.btn.hot{color:var(--hot);border-color:rgba(255,90,44,.35)}
.btn.hot:hover{border-color:var(--hot)}
.btn.ic{padding:6px 9px}
.btn:disabled{opacity:.35;cursor:default}

/* ---------- левая панель ---------- */
#left{grid-row:2/4;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:11px 4px 9px;cursor:pointer;font:500 10.5px var(--mono);letter-spacing:.1em;color:var(--ink2);text-transform:uppercase}
#tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
#leftBody{flex:1;padding:4px 14px 20px}
.sec{padding:14px 0 6px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sh{font:500 10px/1.3 var(--mono);letter-spacing:.16em;color:var(--ink2);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sh .sp{flex:1}
.hint{font:400 12px/1.45 var(--sans);color:var(--ink2);margin:6px 0 10px}
.f{display:block;margin-bottom:10px}
.fl{display:block;font:400 10.5px var(--mono);letter-spacing:.06em;color:var(--ink2);margin-bottom:4px}
.in{width:100%;background:var(--panel2);border:1px solid var(--ink4);padding:6px 8px;font:400 13.5px var(--sans);color:var(--ink);outline:none;border-radius:0}
.in:focus{border-color:var(--ink3)}
textarea.in{resize:vertical;min-height:84px;line-height:1.45}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px}
select.in option{background:#15171a}
.in.num{font-family:var(--mono);font-size:12.5px}
.rg{display:flex;align-items:center;gap:10px}
.rg input{flex:1;accent-color:var(--ink)}
.rv{font:400 11px var(--mono);color:var(--ink2);flex:none;width:104px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* фиксированная ширина: иначе ползунок меняет длину вместе с текстом и «прыгает» под курсором */
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;font:400 13px var(--sans);margin:2px 0 10px;cursor:pointer}
.chk input{accent-color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.snd{border-top:1px solid var(--line);padding:10px 0 4px}
.snd.first{border-top:0;padding-top:2px}
.snd-h{display:flex;align-items:center;gap:8px}
.snd-h b{font:500 13px var(--sans);letter-spacing:.02em}
.snd-h .sp{flex:1}
.snd-h .btn{padding:3px 10px}
.snd .hint{margin:3px 0 7px}
.snd .two{align-items:center;margin-bottom:4px}
.snd .chk{margin:0}
.snd-f{display:flex;align-items:center;gap:8px;font:400 11px var(--mono);color:var(--ink2);margin:2px 0 6px;min-width:0}
.snd-f span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.lnk{background:none;border:0;padding:0;color:var(--ink2);font:inherit;text-decoration:underline;cursor:pointer}
.lnk:hover{color:var(--ink)}

.biomes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.bio{background:none;border:1px solid var(--ink4);padding:4px 4px 6px;cursor:pointer;text-align:center}
.bio canvas{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated;margin-bottom:4px}
.bio span{font:400 11px/1.2 var(--sans);color:var(--ink2)}
.bio.on{border-color:var(--ink)}
.bio.on span{color:var(--ink)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tools .btn{padding:8px 4px;font-size:11.5px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis}
#leftBody .btn,#insp .btn{white-space:normal}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.chips button{background:none;border:1px solid var(--ink4);padding:3px 8px;font:400 11px var(--mono);color:var(--ink2);cursor:pointer;letter-spacing:.04em}
.chips button.on{border-color:var(--ink);color:var(--ink)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cc{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:var(--panel2);border:1px solid var(--ink4);padding:9px 9px 8px;cursor:pointer;text-align:left;min-height:96px}
.cc:hover{border-color:var(--ink3)}
.cc.on{border-color:var(--ink);background:rgba(223,226,216,.08)}
.cc svg{width:30px;height:30px;color:var(--ink);margin-bottom:3px}
.cc b{font:500 13px/1.15 var(--sans)}
.cc small{font:400 10.5px/1.3 var(--sans);color:var(--ink2)}
.cc.hostile svg,.cc.target svg{color:var(--hot)}
.cc.ally svg{color:var(--ally)}
.cc.neutral svg{color:var(--dim)}
.cgh{grid-column:1/-1;font:500 10px var(--mono);letter-spacing:.16em;color:var(--ink2);text-transform:uppercase;margin:10px 0 2px}

.ol{display:flex;align-items:center;gap:8px;padding:5px 6px;cursor:pointer;border:1px solid transparent}
.ol:hover{background:rgba(223,226,216,.04)}
.ol.sel{border-color:var(--ink3);background:rgba(223,226,216,.07)}
.ol svg{width:18px;height:18px;flex:none}
.ol .nm{flex:1;font:400 13px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol .st{font:400 10px var(--mono);color:var(--ink2);white-space:nowrap}
.ol .x{background:none;border:0;color:var(--ink2);cursor:pointer;padding:0 3px;font-size:14px;opacity:0}
.ol:hover .x{opacity:1}
.dot{width:7px;height:7px;flex:none;transform:rotate(45deg);background:var(--ink)}
.dot.hostile,.dot.target{background:var(--hot)} .dot.ally{background:var(--ally)} .dot.neutral{background:var(--dim)} .dot.nav{background:var(--ink)}
.empty{font:400 12.5px/1.5 var(--sans);color:var(--ink2);padding:10px 0}

.lst{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.li{display:flex;gap:4px;align-items:center}
.li .in{padding:4px 6px;font-size:12.5px}
.li .x{background:none;border:1px solid var(--ink4);color:var(--ink2);cursor:pointer;width:26px;height:27px;flex:none}
.li .x:hover{color:var(--hot);border-color:var(--hot2)}
.li input[type=checkbox]{accent-color:var(--hot)}
.ptrow{display:flex;align-items:center;gap:8px;font:400 11.5px var(--mono);color:var(--ink2);padding:3px 0}
.ptrow b{color:var(--ink);font-weight:500;min-width:34px}
.ptrow .sp{flex:1}
.ptrow .x{background:none;border:0;color:var(--ink2);cursor:pointer;font-size:14px}
.ptrow .x:hover{color:var(--hot)}
.embl{display:flex;gap:6px;margin-bottom:10px}
.embl button{background:none;border:1px solid var(--ink4);padding:6px;cursor:pointer;color:var(--ink2)}
.embl button.on{border-color:var(--ink);color:var(--ink)}
.embl svg{width:30px;height:30px;display:block}

/* ---------- вьюпорт ---------- */
#vp{position:relative;overflow:hidden;min-height:0;cursor:default}
#vp.m-brush,#vp.m-place,#vp.m-path{cursor:crosshair}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#handles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#vp.m-select .hdl,#vp.m-select .wph,#vp.m-path .wph{pointer-events:auto}
.hdl{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border:1.5px solid var(--ink);background:rgba(9,10,11,.65);cursor:grab}
.hdl.hostile,.hdl.target{border-color:var(--hot)} .hdl.ally{border-color:var(--ally)} .hdl.neutral{border-color:var(--dim)}
.hdl.sel{width:16px;height:16px;margin:-8px 0 0 -8px;background:var(--ink);box-shadow:0 0 0 4px rgba(223,226,216,.16)}
.hdl.sel.hostile,.hdl.sel.target{background:var(--hot)}
.hdl.dim{opacity:.35}
.wph{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:1px solid var(--ink);background:rgba(9,10,11,.8);
  font:500 9.5px/16px var(--mono);text-align:center;cursor:grab}
#vpTop{position:absolute;left:12px;top:10px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none;flex-wrap:wrap}
.chip{pointer-events:auto;font:500 10.5px var(--mono);letter-spacing:.08em;padding:5px 9px;border:1px solid var(--ink4);background:rgba(9,10,11,.75);color:var(--ink2);text-transform:uppercase;display:flex;gap:8px;align-items:center}
.chip b{color:var(--ink);font-weight:500}
.chip button{background:none;border:0;border-left:1px solid var(--ink4);padding-left:8px;color:var(--ink);cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit}
#vpHint{position:absolute;left:12px;bottom:10px;right:180px;font:400 11px/1.5 var(--mono);color:var(--ink2);pointer-events:none;text-shadow:0 0 6px #000}
#vpXY{position:absolute;right:12px;bottom:10px;font:400 11px var(--mono);color:var(--ink2);pointer-events:none;text-align:right}
:root{--acc:#ffcf4a}
.gz{position:absolute;left:0;top:0;pointer-events:none;display:none}
#vp.m-select .gz,#vp.m-path .gz{pointer-events:auto}
.gz.t{width:22px;height:22px;margin:-11px 0 0 -11px;border:1.5px solid var(--acc);border-radius:50%;cursor:move;background:radial-gradient(circle,var(--acc) 0 2px,transparent 3px)}
.gz.t.lock{cursor:not-allowed;border-style:dashed}
.gz.c{width:26px;height:18px;margin:-9px 0 0 -13px;border:1.5px solid var(--acc);background:rgba(9,10,11,.85);cursor:grab;border-radius:2px}
.gz.c::after{content:"";position:absolute;right:-7px;top:3px;border:5px solid transparent;border-left:6px solid var(--acc)}
.gz.c::before{content:"";position:absolute;left:7px;top:4px;width:7px;height:7px;border:1.5px solid var(--acc);border-radius:50%}
.gz b{position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);white-space:nowrap;font:500 9.5px var(--mono);letter-spacing:.1em;color:var(--acc);text-shadow:0 0 4px #000}
#pip{position:absolute;right:12px;top:44px;width:340px;border:1px solid var(--acc);background:var(--bg);display:none;pointer-events:none;z-index:5}
#pipCv{position:absolute;inset:0;width:100%;height:100%;display:block}
#pip.on{display:block}
#pip .pip-h{display:flex;align-items:center;gap:8px;padding:4px 8px;background:rgba(9,10,11,.9);pointer-events:auto}
#pip .pip-h .k:first-child{flex:1;color:var(--acc)} #pip .pip-h b{color:var(--ink);font-weight:500}
#pip button{background:none;border:1px solid var(--ink4);color:var(--ink);width:22px;height:20px;cursor:pointer;line-height:1}
#pip .pip-v{position:relative;height:191px}
#pip.min .pip-v{display:none}
#pip .pip-sub{position:absolute;left:8px;right:8px;bottom:6px;font:400 11.5px/1.35 var(--sans);text-shadow:0 0 6px #000,0 0 2px #000;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#pip .pip-sub .k{display:block;margin-bottom:2px;font-size:9px}
.wave{display:block;width:100%;height:56px;background:var(--panel2);border:1px solid var(--ink4);margin-bottom:6px;cursor:pointer}
.vinfo{font:400 11px/1.5 var(--mono);color:var(--ink2);margin-bottom:6px}
.vwarn{font:400 12px/1.4 var(--sans);color:var(--hot);margin-bottom:6px}
.vprev{font:400 13px/1.45 var(--sans);min-height:2.9em;border-left:2px solid var(--acc);padding:4px 8px;margin:6px 0;background:var(--panel2);display:none}
.vprev.on{display:block}
.cast{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.cast .pt{overflow:hidden}
.cast .pt i{position:absolute;inset:0}
.cast .pt.cat::after{content:"⌖"}
/* окна поверх редактора: каталог персонажей, кадр портрета */
#dlg{position:fixed;inset:0;z-index:60;background:rgba(5,6,7,.72);display:none;place-items:center}
#dlg.on{display:grid}
#dlg .box{background:var(--panel);border:1px solid var(--ink4);width:min(620px,94vw);max-height:88vh;display:flex;flex-direction:column}
#dlg .bh{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
#dlg .bh .sp{flex:1}
#dlg .bb{padding:14px;overflow:auto;min-height:0}
#dlg .bf{padding:10px 14px;border-top:1px solid var(--line)}
.gcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:10px}
.gc{background:var(--panel2);border:1px solid var(--ink4);color:var(--ink);padding:6px;cursor:pointer;text-align:left;font:500 12px var(--sans)}
.gc:hover,.gc.on{border-color:var(--ink2)}
.gc .th{width:100%;aspect-ratio:258/319;background:#0d0f10;overflow:hidden;position:relative;margin-bottom:5px;filter:grayscale(1)}
.gc .th i{position:absolute;inset:0}
.fr-wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.fr{width:200px;height:249px;border:1px solid var(--ink3);background:#0d0f10;position:relative;overflow:hidden;cursor:grab;flex:none;touch-action:none}
.fr.drag{cursor:grabbing}
.fr i{position:absolute;inset:0;filter:grayscale(1) contrast(1.15) brightness(.92)}
.fr .cross{position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--line),var(--line)) 50% 0/1px 100% no-repeat,linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
/* сервер недоступен или нет прав — редактор не открывается */
#block{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;place-items:center;text-align:center;padding:24px}
#block.on{display:grid}
#block .v{font:300 26px var(--sans);letter-spacing:.06em;margin:8px 0 18px}
#saveState.bad{color:var(--hot)}
.cast .pt{width:48px;height:60px;flex:none;border:1px solid var(--ink4);background:#0d0f10 center/cover;cursor:pointer;position:relative;filter:grayscale(1)}
.cast .pt:hover{border-color:var(--ink3)}
.cast .pt::after{content:"⤒";position:absolute;right:2px;bottom:0;font-size:11px;color:var(--ink2)}
.cast .flds{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.cast .flds .in{padding:4px 6px;font-size:12.5px}
.cast .x{background:none;border:1px solid var(--ink4);color:var(--ink2);cursor:pointer;width:24px;height:24px;flex:none}
.plprev{display:block;width:100%;height:210px;background:#090a0b;border:1px solid var(--ink4);margin-bottom:10px;cursor:grab}

/* ---------- инспектор ---------- */
#right{grid-row:2/4;grid-column:3;border-left:1px solid var(--line);min-height:0;display:flex;flex-direction:column;background:var(--panel)}
#insp{flex:1;padding:0 16px 24px}
.ihead{display:flex;gap:12px;align-items:center;padding:16px 0 12px;border-bottom:1px solid var(--line)}
.ihead svg{width:36px;height:36px;flex:none}
.ihead b{display:block;font:500 17px/1.15 var(--sans)}
.ihead small{font:400 10.5px var(--mono);letter-spacing:.1em;color:var(--ink2);text-transform:uppercase}
.ihead.hostile svg,.ihead.target svg{color:var(--hot)} .ihead.ally svg{color:var(--ally)} .ihead.neutral svg{color:var(--dim)}
.tagl{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.tagl span{font:400 11.5px var(--sans);border:1px solid var(--ink4);padding:2px 7px;cursor:pointer}
.tagl span:hover{border-color:var(--ink3)}

/* ---------- шкала шагов ---------- */
#tl{grid-column:2;grid-row:3;border-top:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:var(--panel)}
.tlh{display:flex;align-items:center;gap:10px;padding:8px 12px 0}
#steps{display:flex;gap:8px;padding:8px 12px 12px;overflow-x:auto;overflow-y:hidden;flex:1;align-items:stretch;scrollbar-width:thin;scrollbar-color:var(--ink4) transparent}
.stp{flex:none;width:200px;border:1px solid var(--ink4);background:var(--panel2);padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:5px;position:relative}
.stp:hover{border-color:var(--ink3)}
.stp.sel{border-color:var(--ink);background:rgba(223,226,216,.07)}
.stp.drop{border-left:3px solid var(--ink)}
.stp .h1{display:flex;gap:8px;align-items:baseline;font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.stp .h1 b{color:var(--ink);font-weight:500}
.stp .tx{font:400 12.5px/1.35 var(--sans);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.stp .tx.emp{color:var(--ink3);font-style:italic}
.stp .cm{font:400 10px var(--mono);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp.add{align-items:center;justify-content:center;width:110px;color:var(--ink2);font:500 12px var(--sans);letter-spacing:.08em;border-style:dashed}

/* ---------- просмотр / тост ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;z-index:20}
#modal.on{display:flex}
#modal .mbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
#modal .mbar .sp{flex:1}
#frame{flex:1;border:0;width:100%;background:var(--bg)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);font:500 12.5px var(--sans);padding:8px 14px;transition:.25s;pointer-events:none;z-index:30}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){ #app{grid-template-columns:250px minmax(0,1fr) 300px} #docTitle{display:none} }
</style>
<script src="core.js"></script>
<script src="voice.js"></script>
<script src="planet.js"></script>
<script type="importmap">
{"imports":{
  "three":"./vendor/three/build/three.module.js",
  "three/addons/":"./vendor/three/addons/"
}}
</script>
</head>
<body>
<div id="app">
  <header id="top">
    <a class="btn" id="bStudio" href="../studio.html#briefings" title="Вернуться в студию" hidden>← Студия</a>
    <div class="brand"><svg viewBox="0 0 64 64" id="brandEmb"></svg><b>СЦЕНАРИСТ</b></div>
    <span id="docTitle"></span>
    <span class="sp"></span>
    <span class="k" id="saveState">сохранено</span>

function placeAt(p, keep) {
  pushUndo();
  const o = Core.makeObject(placeType, r1(p.x), r1(p.z)); const st = selStep(); const d = CATALOG[o.type];
  if (st) { o.mark = st.id; if (d.cat === 'squad' || d.cat === 'nav') o.show = st.id; }   // поставлен при выбранном шаге — на нём и проявится

/* ============================ ручки объектов поверх 3D ============================ */
const HD = { map:new Map(), wps:[] }, hv = new V3();
function syncHandles() {
  const box = $('handles');
  for (const o of sc.objects) { let d = HD.map.get(o.id);
    if (!d) { d = h('div', { class:'hdl' }); d.addEventListener('pointerdown', ev => handleDown(ev, o.id, -1)); d.addEventListener('dblclick', () => { const x = findObj(o.id); if (x) focusObj(x); });
      box.append(d); HD.map.set(o.id, d); }
    d.className = 'hdl ' + o.side + (sel && sel.k === 'obj' && sel.id === o.id ? ' sel' : ''); d.title = o.name; }
  for (const [id, d] of HD.map) if (!findObj(id)) { d.remove(); HD.map.delete(id); }
  HD.wps.forEach(w => w.remove()); HD.wps = [];

  if (pts) pts.forEach((_, i) => { if (i === 0) return; const w = h('div', { class:'wph', title:'Тащите, ПКМ — удалить' }, String(i));
    w.addEventListener('pointerdown', ev => { if (ev.button === 0) handleDown(ev, o.id, i); });
    w.addEventListener('contextmenu', ev => { ev.preventDefault(); removePoint(o, i); });
    w._get = () => pathPoints(o)[i]; box.append(w); HD.wps.push(w); });
}
function placeHandles() {
  const W = vp.clientWidth, H = vp.clientHeight;
  const put = (el, x, z) => { hv.set(x, hf.sample(x, z) + .5, z).project(camera);
    if (hv.z > 1) { el.style.display = 'none'; return; } el.style.display = '';
    el.style.transform = `translate(${((hv.x * .5 + .5) * W).toFixed(1)}px,${((-hv.y * .5 + .5) * H).toFixed(1)}px)` + (el.classList.contains('hdl') ? ' rotate(45deg)' : ''); };
  for (const [id, d] of HD.map) { const o = findObj(id); if (!o) continue; const e = world.ents.get(id);
    const [x, z] = isPath(o) && o.pts.length ? o.pts[0] : [o.x, o.z]; put(d, x, z); d.classList.toggle('dim', !!e && !e.shown); }
  for (const w of HD.wps) { const p = w._get(); if (p) put(w, p[0], p[1]); }
}
let drag = null;
function handleDown(ev, id, i) {
  if (mode !== 'select' && mode !== 'path') return;
  ev.stopPropagation(); ev.preventDefault();
  if (!sel || sel.id !== id) select('obj', id);
  drag = { id, i, started:false, last:pick(ev), sx:ev.clientX, sy:ev.clientY };
}
addEventListener('pointermove', ev => {
  if (!drag) return; const p = pick(ev); if (!p) return;
  if (!drag.started) { if (Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) < 3) return; pushUndo(); drag.started = true; drag.last = drag.last || p; }
  const o = findObj(drag.id); if (!o) return;
  if (drag.i < 0) { const dx = p.x - drag.last.x, dz = p.z - drag.last.z; drag.last = p;
    o.x = r1(o.x + dx); o.z = r1(o.z + dz);
    if (o.wp) o.wp.forEach(w => { w[0] = r1(w[0] + dx); w[1] = r1(w[1] + dz); });
    if (isPath(o)) o.pts.forEach(w => { w[0] = r1(w[0] + dx); w[1] = r1(w[1] + dz); }); }
  else if (isPath(o)) o.pts[drag.i] = [r1(p.x), r1(p.z)];
  else o.wp[drag.i - 1] = [r1(p.x), r1(p.z)];
  markObj(o);
});
addEventListener('pointerup', () => { if (drag && drag.started) renderInspector(); drag = null; });

const dirtyObjs = new Set();

const thumbCache = new Map();
function biomeThumb(id) {
  const key = id + ':' + sc.terrain.seed; if (thumbCache.has(key)) return thumbCache.get(key).cloneNode ? copyCanvas(thumbCache.get(key)) : null;
  const N = 48, c = h('canvas', { width:N, height:N }), x = c.getContext('2d'), img = x.createImageData(N, N);
  const f = BIOMES[id].fn(Core.makeNoise(sc.terrain.seed), 1), v = new Float32Array(N * N); let mn = 1e9, mx = -1e9;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const val = f((i / (N - 1) - .5) * 300, (j / (N - 1) - .5) * 300); v[j * N + i] = val; mn = Math.min(mn, val); mx = Math.max(mx, val); }
  for (let k = 0; k < N * N; k++) { const n = (v[k] - mn) / Math.max(1, mx - mn), line = ((v[k] / 6) % 1 + 1) % 1 < .16 ? 70 : 0, g = 14 + n * 46 + line;
    img.data[k * 4] = g; img.data[k * 4 + 1] = g + 1; img.data[k * 4 + 2] = g - 2; img.data[k * 4 + 3] = 255; }
  x.putImageData(img, 0, 0); thumbCache.set(key, c); return copyCanvas(c);
}

}

/* ---------- персонажи (портреты для окна связи) ----------

   кадр можно подогнать под окно брифинга. Офлайн — свой портрет картинкой (data URL 240×300). */
let gcList = null;                                    // персонажи каталога студии (только с сервером)

  if (!SERVER) return [];
  if (!gcList) { try { gcList = (await Remote.api('/editor/global-characters')).characters || []; } catch (e) { console.warn(e); gcList = []; } }
  return gcList;
}
const catalogFrame = gc => ({ inherit:true, scale:+gc.portrait_scale || 1,
  xRel:gc.portrait_x_rel != null ? +gc.portrait_x_rel : (+gc.portrait_x || 0) / 258,
  yRel:gc.portrait_y_rel != null ? +gc.portrait_y_rel : (+gc.portrait_y || 0) / 258, mirror:+gc.portrait_mirror === 1 });
/* Персонажи «как в каталоге» подтягивают свежие картинку и кадр (в каталоге их могли поправить). */

  const list = await loadCatalog(); let changed = false;
  for (const c of sc.cast) { const gc = c.characterId && list.find(g => g.id === c.characterId); if (!gc) continue;

/* Кадр портрета в окне связи — та же формула, что у рамки терминала: масштаб от ширины окна,

function framePortrait(c) {

  const W = 200, f = Object.assign({ scale:1, xRel:0, yRel:0, mirror:false }, c.frame);
  const view = h('i'), frame = h('div', { class:'fr', title:'Тащите, чтобы сдвинуть; колесо — масштаб' }, view, h('b', { class:'cross' }));
  const sc_ = inRange(() => f.scale, v => { f.scale = v; draw(true); }, { min:.2, max:4, step:.01, fmt:v => '×' + v.toFixed(2) });
  const mir = inBool(() => f.mirror, v => { f.mirror = v; draw(true); }, 'Отразить');
  const info = h('div', { class:'hint' });
  let undoPushed = false;
  function draw(user) {
    if (user) { if (!undoPushed) { pushUndo(); undoPushed = true; } f.inherit = false; }
    Core.applyPortrait(view, { image:c.image, frame:f, portrait:c.portrait || Core.portraitPlaceholder(c.name) }, W);
    sc_.querySelector('input').value = f.scale; sc_.querySelector('.rv').textContent = '×' + f.scale.toFixed(2);
    info.textContent = f.inherit !== false ? 'Кадр как в каталоге. Любая правка здесь делает кадр своим для этого брифинга, каталог не меняется.' : 'Свой кадр для этого брифинга. Каталог не меняется.';
    if (user) { c.frame = Object.assign({}, f); markDirty(); }
  }
  let drag = null;
  frame.addEventListener('pointerdown', e => { drag = { x:e.clientX, y:e.clientY, xr:f.xRel, yr:f.yRel }; frame.setPointerCapture(e.pointerId); frame.classList.add('drag'); });
  frame.addEventListener('pointermove', e => { if (!drag) return; const k = f.mirror ? -1 : 1;
    f.xRel = Math.round((drag.xr + k * (e.clientX - drag.x) / W) * 1e4) / 1e4; f.yRel = Math.round((drag.yr + (e.clientY - drag.y) / W) * 1e4) / 1e4; draw(true); });
  frame.addEventListener('pointerup', () => { drag = null; frame.classList.remove('drag'); });
  frame.addEventListener('wheel', e => { e.preventDefault(); const s0 = f.scale, s1 = Math.min(4, Math.max(.2, s0 * (e.deltaY < 0 ? 1.06 : 1 / 1.06)));
    const r = frame.getBoundingClientRect(), px = (f.mirror ? r.right - e.clientX : e.clientX - r.left) / W, py = (e.clientY - r.top) / W;
    f.xRel = px - (px - f.xRel) * s1 / s0; f.yRel = py - (py - f.yRel) * s1 / s0; f.scale = Math.round(s1 * 1e3) / 1e3; draw(true); }, { passive:false });
  const reset = gc ? h('button', { class:'btn', onclick:() => { pushUndo(); Object.assign(f, catalogFrame(gc)); c.frame = Object.assign({}, f); markDirty(); draw(); } }, 'Как в каталоге') : null;
  dialog(`Кадр портрета · ${c.name || '—'}`,
    h('div', { class:'fr-wrap' }, frame, h('div', { style:'flex:1;min-width:0' }, F('Масштаб', sc_), mir, info,
      h('div', { class:'bar' }, reset, h('button', { class:'btn', onclick:() => { pushUndo(); Object.assign(f, { scale:1, xRel:0, yRel:0, mirror:false, inherit:false }); c.frame = Object.assign({}, f); markDirty(); draw(); } }, 'Сбросить')))),
    h('div', { class:'bar', style:'margin:0;justify-content:flex-end' }, h('button', { class:'btn pri', onclick:() => { closeDialog(); renderLeft(); fillPip(); } }, 'Готово')));
  draw();
}

  sc.steps.splice(at, 0, s); sel = { k:'step', id:s.id }; stepsChanged(); syncHandles(); renderChips();
  requestAnimationFrame(() => { const ta = document.querySelector('#insp textarea'); if (ta) ta.focus(); $('steps').children[at]?.scrollIntoView({ inline:'nearest', block:'nearest' }); });
}
function dupStep(s) { pushUndo(); const c = Core.clone(s); c.id = Core.uid('s'); sc.steps.splice(stepIndex(s.id) + 1, 0, c); sel = { k:'step', id:c.id }; stepsChanged(); }
function moveStep(i, d) { const j = i + d; if (j < 0 || j >= sc.steps.length) return; pushUndo(); const [m] = sc.steps.splice(i, 1); sc.steps.splice(j, 0, m); stepsChanged(); }
function delStep(s) {
  pushUndo(); const i = stepIndex(s.id); sc.steps.splice(i, 1);
  const repl = sc.steps[i]?.id || sc.steps[i - 1]?.id || 'start';     // объекты, привязанные к шагу, переезжают на соседний
  sc.objects.forEach(o => { if (o.show === s.id) o.show = repl; if (o.mark === s.id) o.mark = repl; });
  sel = sc.steps[i] ? { k:'step', id:sc.steps[i].id } : sc.steps[i - 1] ? { k:'step', id:sc.steps[i - 1].id } : null;
  stepsChanged(); toast('Шаг удалён');
}

/* ============================ чипы вьюпорта ============================ */
function renderChips() {
  const st = selStep(), kids = [];
  const modeName = { select:'Выбор', brush:'Кисть: ' + (BRUSHES.find(b => b[0] === brush.tool) || [])[1], place:'Установка: ' + (placeType ? CATALOG[placeType].name : ''), path:'Точки маршрута' }[mode];
  kids.push(h('div', { class:'chip' }, 'Режим ', h('b', null, modeName), mode !== 'select' ? h('button', { onclick:() => setMode('select') }, 'Esc') : null));
  if (st) kids.push(h('div', { class:'chip' }, viewAll ? 'Показана вся сцена' : h('span', null, 'Сцена на шаге ', h('b', null, String(stepIndex(st.id) + 1).padStart(2, '0') + ' · ' + (st.ch || '—'))),
    h('button', { onclick:() => { viewAll = !viewAll; renderChips(); } }, viewAll ? 'по шагу' : 'показать всё')));
  kids.push(h('div', { class:'chip' }, h('button', { style:'border:0;padding:0', onclick:() => { world.animSquads = !world.animSquads; renderChips(); } }, 'Отряды: ' + (world.animSquads ? 'движутся' : 'на старте'))));
  $('vpTop').replaceChildren(...kids);
  $('vpHint').textContent = HINTS[mode];
}
function refreshLists() { if (leftTab === 'scene') renderLeft(); renderSteps(); }
function renderAll() { renderTabs(); renderLeft(); renderInspector(); renderSteps(); renderChips(); syncHandles(); updUndo();
  $('docTitle').textContent = sc.meta.title; $('brandEmb').innerHTML = (EMBLEMS[sc.meta.emblem] || EMBLEMS.hex).svg; }

/* ============================ файл / просмотр ============================ */
function loadScenario(obj) { sc = Core.normalize(obj); Core.terrainFrom(sc, hf); planetPreviewSet(); sel = null; setMode('select'); rebuildWorld(true); renderAll(); markDirty(); }
/* Блобы озвучки шагов, своих звуков и музыки. */
async function voiceBlobs(all = true) { const out = {};
  const ids = [...sc.steps.filter(st => st.voice && st.voice.id).map(st => st.voice.id), ...Core.soundIds(sc)];   // озвучка + свои звуки и музыка
  for (const id of ids) if (!out[id] && (all || !Core.isServerRef(id))) { try { const b = await Core.getAudioBlob(id); if (b) out[id] = b; } catch (e) { console.warn(e); } }
  return out; }   // all = false — для просмотра: файлы с сервера плеер возьмёт сам
/* Замена ссылок на файлы звука в сценарии (после загрузки вшитых файлов на сервер). */
function remapAudio(data, map) {
  const fix = o => { if (o && o.id && map[o.id]) o.id = map[o.id]; };
  (data.steps || []).forEach(st => fix(st.voice));
  const snd = data.sound || {}; Object.values(snd.sfx || {}).forEach(fix); Object.values(snd.music || {}).forEach(fix);
}
$('bExport').onclick = async () => {
  const data = serialize(), blobs = await voiceBlobs(), audio = {};
  for (const id in blobs) audio[id] = await Core.blobToDataURL(blobs[id]);       // озвучка уходит внутрь файла — сценарий самодостаточен
  if (Object.keys(audio).length) data.assets = { audio };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type:'application/json' });
  const a = h('a', { href:URL.createObjectURL(blob), download:`briefing_${(sc.meta.code || 'scenario').replace(/[^\wа-яё-]+/gi, '_')}.json` });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};
$('bImport').onclick = () => $('file').click();
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const data = JSON.parse(await f.text()); if (!data || !Array.isArray(data.objects) || !Array.isArray(data.steps)) throw new Error('нет objects/steps');
    if (data.assets && data.assets.audio) {
      const map = {}, entries = Object.entries(data.assets.audio), kindOf = {};
      (data.steps || []).forEach(st => { if (st.voice && st.voice.id) kindOf[st.voice.id] = 'voice'; });
      Object.values((data.sound || {}).music || {}).forEach(m => { if (m && m.id) kindOf[m.id] = 'music'; });
      for (const [i, [id, url]] of entries.entries()) { const blob = await Core.dataURLToBlob(url);
        if (SERVER) { toast(`Загружаю файлы на сервер: ${i + 1} / ${entries.length}`);
          const ext = (blob.type.match(/(mpeg|mp3|ogg|wav)/) || ['', 'mp3'])[1].replace('mpeg', 'mp3');
          map[id] = await Remote.uploadAudio(new File([blob], `${id.split('/').pop().replace(/\.\w+$/, '')}.${ext}`, { type:blob.type || 'audio/mpeg' }), kindOf[id] || 'sfx'); }
        else await Core.AudioStore.put(id, blob); }
      remapAudio(data, map); delete data.assets; }
    pushUndo(); loadScenario(data); toast('Сценарий загружен'); }
  catch (err) { alert('Не удалось прочитать сценарий: ' + err.message); }
});
$('bPlayer').onclick = () => { save(); open(SERVER ? `player.html?id=${BID}&studio=1` : 'player.html?src=local', '_blank'); };
let pending = null;
async function preview(start = null) { save(); stopCheck(); SE.stopAll(); pending = { scenario:serialize(), start, audio:await voiceBlobs(false) }; $('modal').classList.add('on'); $('frame').src = 'player.html?embed=1&t=' + Date.now(); }
function closePreview() { $('modal').classList.remove('on'); $('frame').src = 'about:blank'; pending = null; }
addEventListener('message', e => {
  if (e.data && e.data.type === 'briefing:ready' && pending && e.source) e.source.postMessage({ type:'briefing:load', ...pending }, '*');
  if (e.data && e.data.type === 'briefing:exit' && e.source === $('frame').contentWindow) closePreview();
});
$('bPreview').onclick = () => preview(null);
$('mClose').onclick = closePreview;
$('bUndo').onclick = undo; $('bRedo').onclick = redo;

addEventListener('keydown', ev => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
  const mod = ev.ctrlKey || ev.metaKey;
  if (mod && ev.code === 'KeyZ') { if (typing) return; ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if (mod && ev.code === 'KeyY') { if (typing) return; ev.preventDefault(); redo(); return; }
  if (mod && ev.code === 'KeyS') { ev.preventDefault(); save(); toast('Сохранено'); return; }
  if (typing) { if (ev.code === 'Escape') document.activeElement.blur(); return; }
  if (ev.code === 'Escape') { if ($('dlg').classList.contains('on')) closeDialog(); else if ($('modal').classList.contains('on')) closePreview(); else if (mode !== 'select') setMode('select'); else select(null); }
  else if (ev.code === 'Enter' && mode === 'path') setMode('select');
  else if (ev.code === 'Delete' || ev.code === 'Backspace') { const o = selObj(); if (o) { ev.preventDefault(); delObj(o); } }
  else if (mod && ev.code === 'KeyD') { ev.preventDefault(); const o = selObj(), s = selStep(); if (o) dupObj(o); else if (s) dupStep(s); }
  else if (ev.code === 'KeyQ' || ev.code === 'KeyE') { const o = selObj(); if (o && !CATALOG[o.type].kind) { pushUndo(); o.rot = (((o.rot || 0) + (ev.code === 'KeyE' ? 15 : -15)) + 540) % 360 - 180; markObj(o); renderInspector(); } }
  else if (ev.code === 'KeyF') { const o = selObj(); if (o) focusObj(o); else { const s = selStep(); if (s) showView(s); } }
});
addEventListener('beforeunload', save);

/* ============================ кадр ============================ */
function resize() { const w = vp.clientWidth, hh = vp.clientHeight; if (!w || !hh) return;
  renderer.setSize(w, hh, false); composer.setSize(w, hh); bloom.resolution.set(w * DPR / 2, hh * DPR / 2); camera.aspect = w / hh; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(vp); resize();

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime; world.time.value = t;
  if (tween) { tween.t = Math.min(1, tween.t + dt / .9); const k = Core.ss(0, 1, tween.t);
    camera.position.lerpVectors(tween.p0, tween.p1, k); controls.target.lerpVectors(tween.t0, tween.t1, k); if (tween.t >= 1) tween = null; }
  controls.update();
  if (painting && cursorPt) { hf.brush(cursorPt.x, cursorPt.z, brush.radius, brush.strength * dt * 40, brush.tool, brushTarget, roughN); hf.compose(sc.objects); world.terrain.sync(); world.snapBodies(); }
  if (modsDirty) { modsDirty = false; dirtyObjs.clear(); hf.compose(sc.objects); rebuildWorld(true); }
  if (mode === 'place' && ghostDirty && ghostObj) { ghostDirty = false;
    if (cursorPt) { ghostObj.x = r1(cursorPt.x); ghostObj.z = r1(cursorPt.z); if (isPath(ghostObj)) ghostObj.pts = [[ghostObj.x, ghostObj.z]]; world.setGhost(ghostObj); } }
  if (dirtyObjs.size) { for (const id of dirtyObjs) { const o = findObj(id); if (o) world.rebuild(o); } dirtyObjs.clear(); markers.sync(world); syncHandles(); }
  const st = selStep();
  world.tick(dt, t, st && !viewAll ? stepIndex(st.id) : 1e6, true);
  markers.update(world, camera, vp.clientWidth, vp.clientHeight);
  placeHandles(); updateGizmo();
  brushRing.visible = mode === 'brush' && !!cursorPt;
  if (brushRing.visible) { const a = ringGeo.attributes.position.array;
    for (let i = 0; i <= 64; i++) { const q = i / 64 * Math.PI * 2, x = cursorPt.x + Math.cos(q) * brush.radius, z = cursorPt.z + Math.sin(q) * brush.radius;
      a[i * 3] = x; a[i * 3 + 1] = hf.sample(x, z) + 1; a[i * 3 + 2] = z; }
    ringGeo.attributes.position.needsUpdate = true; ringGeo.computeBoundingSphere(); }
  composer.render(); renderPip();
  requestAnimationFrame(frame);
}
renderAll();
if (SERVER) syncCatalogCast();
requestAnimationFrame(frame);
window.__ed = { get sc() { return sc; }, world, select, setMode, startPlace, placeAt, regen, addRandomPath, preview, hf, Core };   // для отладки из консоли
</script>
