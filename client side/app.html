<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Терминал</title>
  <!--
    Оболочка сайта. Страницы (терминал, досье, панель, студия, вход) открываются внутри неё,
    а фоновая музыка играет здесь: при переходе между страницами меняется только содержимое,
    и звук не прерывается. Адрес страницы — после #: app.html#pilot_profile.html.
    Открытая напрямую страница сама переходит сюда (скрипт в начале её <head>).
  -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #050508; }
    #app-frame { position: fixed; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #050508; }
  </style>
</head>
<body>
  <iframe id="app-frame" title="Терминал" allow="autoplay; fullscreen; clipboard-write"></iframe>
  <audio id="shell-music" preload="auto"></audio>
  <script src="scripts/app-shell.js"></script>
</body>
</html>
